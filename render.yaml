services:
  - type: web
    name: asbily-controller
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CONTROLLER_SESSION_SECRET
        generateValue: true
      - key: CONTROLLER_ENCRYPTION_KEY
        generateValue: true
      - key: ASBILY_ADMIN_EMAIL
        sync: false
      - key: ASBILY_ADMIN_PASSWORD
        sync: false
      - key: VERCEL_BACKEND_URL
        sync: false
      - key: RAILWAY_BACKEND_URL
        sync: false
      - key: RENDER_BACKEND_URL
        sync: false
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: LEMONSQUEEZY_STORE_ID
        sync: false
